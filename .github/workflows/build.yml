name: Build NRO

# P1 / T1.4 - cross-compile the .nro on every push so the .nro can be downloaded
# from the Actions artifact instead of being built locally.
#
# The container image is the official devkitPro one (devkitPro/docker :: devkita64).

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install devkitPro packages
        # dkp-pacman is the package manager inside the devkitPro containers
        run: |
          dkp-pacman -S --noconfirm --needed \
            switch-dev devkitA64 libnx switch-tools \
            switch-sdl2 switch-sdl2_image switch-sdl2_mixer switch-sdl2_ttf \
            switch-mesa switch-libdrm_nouveau switch-pkg-config

      - name: Show toolchain versions
        run: |
          export DEVKITA64="$DEVKITPRO/devkitA64"
          export PATH="$DEVKITA64/bin:$DEVKITPRO/portlibs/switch/bin:$PATH"
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITA64=$DEVKITA64"
          which aarch64-none-elf-gcc
          aarch64-none-elf-gcc --version | head -n 1
          dkp-pacman -Q switch-sdl2 switch-sdl2_image switch-sdl2_mixer switch-sdl2_ttf switch-tools

      - name: Build sdl_demo
        run: |
          export DEVKITA64="$DEVKITPRO/devkitA64"
          export PATH="$DEVKITA64/bin:$DEVKITPRO/portlibs/switch/bin:$PATH"
          make -C sdl_demo

      - name: Upload sdl_demo.nro
        uses: actions/upload-artifact@v4
        with:
          name: sdl_demo-nro
          path: sdl_demo/sdl_demo.nro
          if-no-files-found: error

      # P2 / R11: does SDL2 give us a GLES2 (EGL) context on the Switch?
      # Separate target and separate artifact so a failure here cannot be
      # confused with sdl_demo's P1 gate.
      - name: Build gl_probe (R11)
        run: |
          export DEVKITA64="$DEVKITPRO/devkitA64"
          export PATH="$DEVKITA64/bin:$DEVKITPRO/portlibs/switch/bin:$PATH"
          make -C gl_probe

      - name: Upload gl_probe.nro
        uses: actions/upload-artifact@v4
        with:
          name: gl_probe-nro
          path: gl_probe/gl_probe.nro
          if-no-files-found: error